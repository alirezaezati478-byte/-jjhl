<style>

tr:hover td{background:color-mix(in srgb,var(--acc) 5%,transparent)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r1)}
input,select{font-family:inherit;font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:var(--r1);padding:6px 9px;width:100%;transition:border-color .16s}
input:focus,select:focus{outline:none;border-color:var(--acc)}

label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:4px}
.fl{margin-bottom:9px}
button.act{font-family:inherit;font-size:12.5px;background:var(--acc);color:#fff;border:none;border-radius:var(--r1);padding:7px 15px;cursor:pointer;transition:transform .16s,filter .16s}
button.act:hover{transform:translateY(-1px);filter:brightness(1.08)}
button.act.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
button.act.danger{background:var(--bad)}
.sig{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r1);font-size:12.5px;margin-bottom:8px;border:1px solid var(--line);background:var(--bg)}
.sig .d{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}
.sig.ok .d{background:var(--ok)} .sig.warn .d{background:var(--warn)} .sig.bad .d{background:var(--bad)}
.note{font-size:12px;color:var(--mut);margin-top:6px}
.chain li{margin-bottom:6px;font-size:13px}

.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc)}
.match-ok{color:var(--ok);font-weight:700} .match-bad{color:var(--bad);font-weight:700}
svg text{font-family:Vazirmatn,sans-serif;font-size:10.5px;fill:var(--mut)}
@media print{header.top,nav.tabs,.noprint{display:none!important}body{background:#fff;color:#000}section.tab{display:none}section.tab.on{display:block}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>

const FX={usdGov:1860470,usdFree:2698000,eurGov:2079860,eurFree:3005900,equipPct:0.35};
const VERS=["mahastanV60","mahastanV50","mahastanV40"], KEY="mahastanV80";
/* ================= داده پیش‌فرض ================= */
function defData(){return{
 projs:[

 gantt:[

  {n:"کانال‌کشی شبکه صنعتی",w:5,act:4},{n:"آسفالت و جدول",w:4,act:4},
  {n:"نازک‌کاری داخلی",w:6,act:5},{n:"نما و نازک‌کاری خارجی",w:4,act:3},
  {n:"سیستم اطفاء و HSE",w:3,act:3},{n:"آزمایش و تست",w:3,act:2},
  {n:"تحویل موقت فاز ۱",w:2,act:1},{n:"رفع نقایص",w:1,act:0},{n:"تحویل قطعی",w:0,act:0}],
 scenario:"B",
 compet:[{n:"رقبای داخلی مولتی‌پلکس",k:0.97},{n:"کنسرسیوم فولادی",k:1.02},{n:"پیمانکار تازه‌وارد منطقه",k:0.93}],
 ck:[false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false]
}}
/* ================= کمکی‌ها ================= */
const fa="۰۱۲۳۴۵۶۷۸۹", sfa=s=>String(s).replace(/[0-9]/g,d=>fa[d]);
const num=x=>Number(x)||0;
const fa2=s=>s.toLocaleString("en-US").replace(/[0-9,.]/g,d=>d===","?"،":fa[+d]);
const fmt=v=>fa2(Math.round(num(v)));
const fmtBn=v=>{v=num(v);const b=v/1e9;return fa2(b.toFixed(b<10?2:b<100?1:0))+" میلیارد"};
const pctf=v=>fa2((num(v)).toFixed(1))+"٪";
const J=(d,m)=>{const g=new Date();let t=Math.floor(g.getTime()/864e5)+1948320,y=Math.floor(t/1461)*4,n=t%1461;let mo=[0,31,62,93,124,155,186,216,246,276,306,336];let k=0;for(;k<12;k++){if(n<mo[k]+(k<7?31:30))break}const day=n-mo[k]+1;return sfa(`${y+k}/${(k+1).toString().padStart(2,"0")}/${day.toString().padStart(2,"0")}`)};
function setPath(o,p,v){const a=String(p).split(".");let c=o;for(let i=0;i<a.length-1;i++){c=c[a[i]]=c[a[i]]||{}}c[a[a.length-1]]=v}
function getPath(o,p){return String(p).split(".").reduce((c,k)=>c&&c[k],o)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
let saveT;const saveSoon=()=>{clearTimeout(saveT);saveT=setTimeout(save,400)};
function syncInputs(root){root.querySelectorAll("input[data-k],select[data-k]").forEach(el=>{const v=getPath(D,el.dataset.k);if(v!=null)el.value=v})}
/* ================= محاسبات ================= */
function comp4026(d){
 const seas=SEASONS, oh=seas*OH, rg=seas*RG;
 const c0=seas+oh+rg, base=c0*(1+EQ);
 const w={ab:num(d.sh.wAb)/100,mk:num(d.sh.wMk)/100,br:num(d.sh.wBr)/100};
 const kf=1.696*w.ab+1.858*w.mk+1.907*w.br;
 const Dk=base*kf;
 const other=num(d.sh.tax)/100+num(d.sh.m104)/100+num(d.sh.room)/100+num(d.sh.audit)/100;
 const final=Dk*(1+num(d.sh.profit)/100+other);
 const floor=Dk*(1+other);
 return {seas,oh,rg,c0,base,kf,Dk,other,final,floor,mismatch:(base-BK)/BK*100};
}
function riskCalc(d){
 const oh=SEASONS*OH,rg=SEASONS*RG,base=(SEASONS+oh+rg)*(1+EQ);
 const kf=1.696, Dk=base*kf;
 const other=num(d.risk.tax)/100+num(d.risk.m104)/100+num(d.risk.room)/100+num(d.risk.audit)/100;
 return {Dk,other,final:Dk*(1+num(d.risk.profit)/100+other),floor:Dk*(1+other)};
}
function evm(d){
 let pv=0,ev=0,plan=0;
 d.gantt.forEach((g,i)=>{pv+=g.w*(g.act>=ganttPlan(i)?1:g.act/ganttPlan(i));ev+=g.w*Math.min(1,g.act/ganttPlan(i));plan+=g.w});
 const BAC=243160430768, f=D.final/BAC;
 return {pv:pv/plan,ev:ev/plan,plan:1,spi:(ev/plan)/(pv/plan),bac:BAC,dev:(ev-pv)/plan*100};
}
function ganttPlan(i){return i<6?i+1:i<12?Math.min(12,i+2):12} // برنامه تجمعی ماه
function machCalc(d){
 let own=0,rent=0,tot=0,share=num(d.mach.share)/100;
 d.mach.items.forEach(m=>{
  const mcost=m.c*num(m.rate)*num(m.mo)*1e6;tot+=mcost;
  const bcost=num(m.buy)*m.c*1e6 - num(m.resale)*m.c*1e6;
  const rcost=num(m.rent)*m.c*num(m.months)*1e6;
  own+=Math.max(bcost,0);rent+=rcost;});
 return {tot,own,rent,rec:tot*share,better:own<rent?"خرید":"اجاره",diff:Math.abs(own-rent)};
}
function sigs(d){
 const c=comp4026(d),out=[];
 const mm=Math.abs(c.mismatch);
 out.push({lv:mm<0.05?"ok":"bad",t:"تطابق قیمت پایه برگه",d:`اختلاف مسیر محاسباتی با مبلغ مستند برگه: ${pctf(c.mismatch)} ${mm<0.05?"— تأیید برآوردگر":"— نیازمند بررسی فوری"}`});
 const ev=evm(d);
 if(ev.spi<0.95)out.push({lv:"bad",t:"انحراف پیشرفت",d:`SPI = ${fa2(ev.spi.toFixed(2))} — پیشرفت واقعی عقب‌تر از برنامه است`});
 else if(ev.spi>1.15)out.push({lv:"warn",t:"انحراف پیشرفت",d:`SPI = ${fa2(ev.spi.toFixed(2))} — جلوتر از برنامه؛ بررسی کیفیت ثبت`});
 else out.push({lv:"ok",t:"انحراف پیشرفت",d:`SPI = ${fa2(ev.spi.toFixed(2))} — در محدوده قابل قبول`});
 const mc=machCalc(d);
 if(mc.rec>0)out.push({lv:"warn",t:"ماشین‌آلات",d:`سهم ماشین‌آلات (${pctf(mc.share*100)}) معادل ${fmtBn(mc.rec)} ریال است؛ راه بهینه: ${mc.better}`});
 return out;
}
/* ================= SVG ================= */
const C=()=>document.documentElement.dataset.theme==="dark"?"#93a1b8":"#5b6b82";
function donut(parts,sel){
 let a=-90,tot=parts.reduce((s,p)=>s+p.v,0),R=60,r=38,cx=80,cy=80,out="";
 parts.forEach(p=>{const f=p.v/tot,a2=a+f*360;const large=f>0.5?1:0;
  const x1=cx+R*Math.cos(a*Math.PI/180),y1=cy+R*Math.sin(a*Math.PI/180);
  const x2=cx+R*Math.cos(a2*Math.PI/180),y2=cy+R*Math.sin(a2*Math.PI/180);
  const x3=cx+r*Math.cos(a2*Math.PI/180),y3=cy+r*Math.sin(a2*Math.PI/180);
  const x4=cx+r*Math.cos(a*Math.PI/180),y4=cy+r*Math.sin(a*Math.PI/180);
  if(f<1)out+=`<path d="M${x1} ${y1} A${R} ${R} 0 ${large} 1 ${x2} ${y2} L${x3} ${y3} A${r} ${r} 0 ${large} 0 ${x4} ${y4} Z" fill="${p.c}" opacity=".88"><title>${p.t}: ${pctf(f*100)}</title></path>`;
  a=a2});
 out+=`<text x="80" y="76" text-anchor="middle" font-weight="700" font-size="13" fill="currentColor" style="fill:var(--ink)">${fmtBn(tot)}</text><text x="80" y="92" text-anchor="middle">ریال</text>`;
 document.querySelector(sel).innerHTML=`<svg viewBox="0 0 160 160" width="100%" style="max-width:210px">${out}</svg>`+parts.map(p=>`<div class="sig" style="padding:4px 8px"><span class="d" style="background:${p.c}"></span><span>${p.t}: <b>${pctf(p.v/tot*100)}</b></span></div>`).join("");
}
function bars(vals,labels,sel,h=170){
 const mx=Math.max(...vals),n=vals.length,bw=100/n;
 let s=`<defs><linearGradient id="gBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc)"/><stop offset="1" stop-color="#0a3f8f"/></linearGradient></defs>`;
 const mxI=vals.indexOf(mx);
 vals.forEach((v,i)=>{const hh=v/mx*(h-34);const x=i*bw+4,w=bw-8;
  s+=`<rect x="${x}" y="${h-24-hh}" width="${w}" height="${hh}" rx="4" fill="${i===mxI?"url(#gBar)":"var(--acc)"}" opacity="${i===mxI?1:.55}"><title>${labels[i]}: ${fmt(v)}</title></rect>`;
  s+=`<text x="${x+w/2}" y="${h-28-hh}" text-anchor="middle" style="fill:var(--ink)">${fmtBn(v).replace(" میلیارد","")}</text>`;
  s+=`<text x="${x+w/2}" y="${h-8}" text-anchor="middle">${labels[i]}</text>`});
 document.querySelector(sel).innerHTML=`<svg viewBox="0 0 100 ${h}" width="100%" preserveAspectRatio="none" style="overflow:visible">${s}</svg>`;
}
function scurve(d,sel){
 const h=210,W=100;
 let pv=0,ev=0,tot=0;d.gantt.forEach(g=>tot+=g.w);
 const cum=(mode)=>{let c=0,arr=[];for(let m=1;m<=12;m++){let s=0;d.gantt.forEach((g,i)=>{const p=ganttPlan(i),end=p;const done=mode==="act"?g.act:p;const frac=Math.max(0,Math.min(1,(m-(end-g.w>0?end-g.w:0))/Math.max(g.w,1)));s+=g.w*(mode==="act"?Math.min(1,g.act/Math.max(p,1))* (m>=Math.min(p,g.act+p)?1:frac):frac)});c+=s;arr.push(c/tot)}return arr};
 const P=cum("plan"),A=cum("act");
 const pt=(arr,i)=>`${i*(W/11)},${h-24-arr[i]*(h-44)}`;
 const line=a=>a.map((v,i)=>i===0?`M${pt(a,i)}`:`L${pt(a,i)}`).join(" ");
 let s=`<line x1="0" y1="${h-24}" x2="100" y2="${h-24}" stroke="${C()}" stroke-width=".3"/>`;
 for(let k=0;k<=4;k++){const y=h-24-k*(h-44)/4;s+=`<line x1="0" y1="${y}" x2="100" y2="${y}" stroke="${C()}" stroke-width=".2" opacity=".35"/><text x="101" y="${y+2}" font-size="4">${fa2(k*25)}٪</text>`}
 s+=`<path d="${line(P)}" fill="none" stroke="var(--acc)" stroke-width="1"/>`;
 s+=`<path d="${line(A)}" fill="none" stroke="var(--acc2)" stroke-width="1" stroke-dasharray="2 1.2"/>`;
 for(let i=0;i<12;i++)s+=`<text x="${i*(W/11)}" y="${h-10}" text-anchor="middle" font-size="4">${sfa(i+1)}</text>`;
 s+=`<rect x="55" y="2" width="2" height="6" fill="var(--acc)"/><text x="59" y="7" font-size="4.5">برنامه</text><rect x="72" y="2" width="2" height="6" fill="var(--acc2)"/><text x="76" y="7" font-size="4.5">واقعی</text>`;
 document.querySelector(sel).innerHTML=`<svg viewBox="0 0 112 ${h}" width="100%" style="overflow:visible">${s}</svg>`;
}
function cashChart(d,sel){
 const N=Math.max(3,Math.min(36,num(d.cash.months)));const BAC=243160430768;
 const w=d.gantt.map(g=>g.w),T=w.reduce((a,b)=>a+b,0);
 const infl=num(d.cash.infl)/100;
 const sig=(m)=>1/(1+Math.exp(-((m-N*0.45)/(N*0.16))));
 const cost=[],rec=[];
 let cumC=0,cumR=0;
 for(let m=1;m<=N;m++){
  const prog=Math.min(1,sig(m)),prev=Math.min(1,sig(m-1));
  const wgt=prog-prev, c=BAC*wgt*Math.pow(1+infl,m-1);
  let r=BAC*wgt*(1+num(d.cash.prepay)/100*(m===1?1:0));
  r=BAC*(prog)*(1-num(d.cash.ret)/100) - BAC*Math.max(0,prev)*(1-num(d.cash.ret)/100);
  cumC+=c;cumR+=r;cost.push(cumC/1e9);rec.push(cumR/1e9);
 }

/* ================= Three.js ================= */
let threeLoaded=false;
function init3d(projs){
 const el=document.getElementById("v3d");if(!el)return;
 try{
  if(!window.THREE){el.innerHTML=`<div class="note" style="padding:20px">کتابخانه Three.js بارگذاری نشد — اتصال اینترنت به cdnjs را بررسی کنید.</div>`;return}
  const W=el.clientWidth,H=380;
  const sc=new THREE.Scene();sc.background=new THREE.Color(0x0d1220);
  const cam=new THREE.PerspectiveCamera(50,W/H,.1,2000);cam.position.set(500,420,520);cam.lookAt(0,80,0);
  const rn=new THREE.WebGLRenderer({antialias:true});rn.setSize(W,H);el.innerHTML="";el.appendChild(rn.domElement);
  sc.add(new THREE.AmbientLight(0xffffff,.55));
  const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(400,600,300);sc.add(dl);
  const cols=[0x0e5fd8,0xf59e0b,0x0f9d6e,0xd64545],mx=Math.max(...projs.map(p=>p.price));
  projs.forEach((p,i)=>{
   const h=p.price/mx*300,g=new THREE.CylinderGeometry(55,55,h,32);
   const m=new THREE.Mesh(g,new THREE.MeshPhongMaterial({color:cols[i],transparent:true,opacity:.85}));
   m.position.set(i*180-270,h/2,0);sc.add(m);
  });
  const grid=new THREE.GridHelper(900,18,0x26314a,0x1a2338);sc.add(grid);
  let a=0;(function loop(){a+=.004;sc.rotation.y=a;rn.render(sc,cam);requestAnimationFrame(loop)})();
 }catch(e){el.innerHTML=`<div class="note" style="padding:20px">نمایش سه‌بعدی در این مرورگر ممکن نیست.</div>`}
}

document.addEventListener("click",e=>{

 else if(a==="tab"){document.querySelectorAll("nav.tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
  document.querySelectorAll("section.tab").forEach(s=>s.classList.remove("on"));document.getElementById(v).classList.add("on");window.scrollTo(0,0)}

});
